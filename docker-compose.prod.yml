# Stack de producción (FRONTEND_PLAN.md → "Despliegue — self-hosted").
#
# Layout esperado en la máquina de despliegue (repos lado a lado):
#   ~/coffee/CoffeeProyect        (backend Go)
#   ~/coffee/CoffeeProyect-web    (este repo; el compose vive acá)
#
# Uso:  cp .env.production.example .env   (y completar secretos)
#       docker compose -f docker-compose.prod.yml up -d --build
#
# Solo Caddy publica puerto (:80); web/api/postgres/redis quedan en la
# red interna de Docker. El acceso público lo pone Tailscale o Cloudflare
# Tunnel apuntando a localhost:80.

name: coffeeproyect

services:
  web:
    build:
      context: .
      args:
        # /api relativo: el navegador lo resuelve contra el origen y Caddy
        # lo rutea a la API. Se hornea en el build (NEXT_PUBLIC_*).
        NEXT_PUBLIC_API_URL: /api
        # metadataBase (OG/SEO): poner la URL pública real al desplegar.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
        # Login con Google (se hornea en el build; frontend + backend deben
        # tener el mismo valor). Sin valor → el botón no se renderiza.
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        # Pagos Wompi: botón de pago visible en el front (se hornea en el
        # build). Sin valor → 503 PAYMENTS_DISABLED en el backend.
        NEXT_PUBLIC_PAYMENTS_ENABLED: ${NEXT_PUBLIC_PAYMENTS_ENABLED:-}
    image: coffeeproyect-web
    restart: unless-stopped
    environment:
      # RSC fetch directo al contenedor de la API (Node no acepta /api
      # relativo). Ver src/lib/api/config.ts.
      SERVER_API_URL: http://api:8080
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ../CoffeeProyect
    image: coffeeproyect-api
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://coffee:${POSTGRES_PASSWORD:-coffee}@postgres:5432/coffeedb?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env (openssl rand -hex 32)}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?falta ADMIN_API_KEY en .env}
      # Login con Google: el backend valida el ID token del navegador contra
      # Google (JWKS). Sin valor → login con Google desactivado.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Pagos Wompi (sandbox/prod). Sin valor → payments disabled (503).
      WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY:-}
      WOMPI_INTEGRITY_SECRET: ${WOMPI_INTEGRITY_SECRET:-}
      WOMPI_EVENT_SECRET: ${WOMPI_EVENT_SECRET:-}
      # URL pública para el redirect del checkout (opcional; si falta,
      # Wompi muestra su propia página de éxito).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: coffeedb
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coffee}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee -d coffeedb"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
