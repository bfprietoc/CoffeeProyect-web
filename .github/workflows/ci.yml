name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # PageProps/LayoutProps son tipos globales que Next genera en .next/types;
      # sin un dev/build previo (checkout limpio) el typecheck fallaría.
      - run: npm run typegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
